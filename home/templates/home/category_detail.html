<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category.name }} - کلینیک دامپزشکی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* استایل‌های کاملاً ایزوله برای صفحه جزئیات */
        .category-detail-page {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a2e, #16213e);
            color: #e2e8f0;
            overflow-x: hidden;
            line-height: 1.8;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .category-detail-page * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* هیرو سکشن */
        .cd-hero {
            min-height: 70vh;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(126, 87, 194, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(255, 107, 139, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(38, 198, 218, 0.25) 0%, transparent 50%),
                linear-gradient(135deg, #0a0a1a, #1a1a2e, #16213e);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 3rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cd-hero-content {
            text-align: center;
            color: white;
            z-index: 2;
            max-width: 1000px;
            position: relative;
        }

        .cd-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            background: linear-gradient(45deg, #ffd166, #26c6da, #ff6b8b, #ab47bc);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: cd-textShine 6s infinite linear;
            text-shadow: 0 0 30px rgba(255, 209, 102, 0.3);
        }

        .cd-subtitle {
            font-size: 1.6rem;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            line-height: 1.6;
        }

        .cd-typewriter {
            overflow: hidden;
            border-right: 2px solid #ffd166;
            white-space: nowrap;
            margin: 0 auto;
            width: 0;
            font-size: 1.4rem;
            font-weight: 300;
            color: #ffd166;
            max-width: 500px;
        }

        /* محتوا */
        .cd-content {
            padding: 4rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .cd-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .cd-image {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 80px rgba(126, 87, 194, 0.3);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .cd-image img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .cd-image:hover {
            transform: translateY(-10px) rotate(1deg) scale(1.02);
        }

        .cd-image:hover img {
            transform: scale(1.08);
        }

        .cd-section-title {
            font-size: 2.8rem;
            margin-bottom: 2.5rem;
            background: linear-gradient(45deg, #ffd166, #26c6da);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cd-description {
            font-size: 1.3rem;
            line-height: 2;
            margin-bottom: 3rem;
            color: #94a3b8;
            text-align: justify;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .cd-description:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-8px);
        }

        .cd-features {
            list-style: none;
            margin-bottom: 3rem;
        }

        .cd-features li {
            padding: 1.5rem;
            margin-bottom: 1.2rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            display: flex;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .cd-features li:hover {
            transform: translateX(15px) scale(1.02);
            border-color: #ff6b8b;
        }

        .cd-features li i {
            color: #ffd166;
            margin-left: 1.5rem;
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 209, 102, 0.1);
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .cd-features li:hover i {
            transform: scale(1.2) rotate(10deg);
            background: linear-gradient(135deg, #ffd166, #ffed4e);
            color: #0a0a1a;
        }

        .cd-feature-text {
            flex: 1;
            font-size: 1.2rem;
            line-height: 1.7;
        }

        /* انیمیشن‌ها */
        @keyframes cd-textShine {
            0% { background-position: -200% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes cd-typewriter {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes cd-blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: #ffd166; }
        }

        /* رسپانسیو */
        @media (max-width: 968px) {
            .cd-grid {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            
            .cd-title {
                font-size: 2.5rem;
            }
            
            .cd-subtitle {
                font-size: 1.3rem;
            }
            
            .cd-section-title {
                font-size: 2.2rem;
            }
            
            .cd-image img {
                height: 350px;
            }
            
            .cd-description {
                font-size: 1.1rem;
                padding: 2rem;
            }
        }
    </style>
</head>
<body class="category-detail-page">
    <!-- هیرو -->
    <section class="cd-hero">
        <div class="cd-hero-content">
            <h1 class="cd-title">{{ category.name }}</h1>
            <p class="cd-subtitle">{{ category.subtitle }}</p>
            <div class="cd-typewriter" id="cdTypewriter">{{ category.typewriter_text }}</div>
        </div>
    </section>

    <!-- محتوا -->
    <section class="cd-content">
        <div class="cd-grid">
            <!-- متن -->
            <div class="cd-info">
                <h2 class="cd-section-title">خدمات تخصصی ما</h2>
                <p class="cd-description">{{ category.description }}</p>
                <ul class="cd-features">
                    {% for feature in features %}
                        <li>
                            <i class="fas fa-check-circle"></i>
                            <span class="cd-feature-text">{{ feature.title }}</span>
                        </li>
                    {% endfor %}
                </ul>
            </div>
            
            <!-- تصویر -->
            <div class="cd-image">
                <img src="{{ category.main_image.url }}" alt="{{ category.name }}">
            </div>
        </div>
    </section>

    <script>
        // فعال کردن تایپ‌رایت
        document.addEventListener('DOMContentLoaded', function() {
            const typewriter = document.getElementById('cdTypewriter');
            if (typewriter) {
                setTimeout(() => {
                    typewriter.style.animation = 'cd-typewriter 2.5s steps(40, end), cd-blink 1s infinite';
                    typewriter.style.width = '100%';
                }, 1000);
            }
        });
    </script>
</body>
</html>
